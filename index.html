                          <div className="min-w-0">
                            <span className="font-mono text-xs font-bold text-indigo-700 dark:text-indigo-400">{item.ID}</span>
                            <h4 className="font-bold text-slate-900 dark:text-white truncate">{item.itemName}</h4>
                            <p className="text-xs text-slate-500 dark:text-slate-400 truncate">
                              {item.category} • {item.location}
                            </p>
                          </div>
                        </div>
                        <TypeBadge type={item.type} />
                      </div>

                      {aiMatch && (
                        <div className="flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-xl bg-indigo-500/10 dark:bg-indigo-950/50 border border-indigo-400/35">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="ai-badge-glow inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 text-white text-[10px] font-bold border border-indigo-300/60">
                              <Icon name="sparkles" className="w-3 h-3" />
                              AI Match: {aiMatch.matchScore}%
                            </span>
                            <span className="font-mono text-[11px] font-bold text-indigo-800 dark:text-indigo-200">
                              ↔ {aiMatch.ID}
                            </span>
                          </div>
                          {onResolveAIMatch && (
                            <button
                              type="button"
                              onClick={() => onResolveAIMatch(item, aiMatch)}
                              className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-bold shadow-sm"
                            >
                              <Icon name="check" className="w-3.5 h-3.5" />
                              Resolve Match
                            </button>
                          )}
                        </div>
                      )}
                      {!aiMatch && item.status === "Resolved" && item.autoResolvedByAI && (
                        <div className="flex flex-wrap items-center gap-1.5 p-2 rounded-xl bg-emerald-500/10 dark:bg-emerald-950/40 border border-emerald-400/35">
                          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-800 dark:text-emerald-200 text-[10px] font-bold">
                            ⚡ Auto-Resolved by AI{item.aiConfidence ? ` (${item.aiConfidence}%)` : ""}
                          </span>
                          {item.linkedMatchID && (
                            <span className="font-mono text-[11px] font-bold text-indigo-800 dark:text-indigo-200">
                              ↔ {item.linkedMatchID}
                            </span>
                          )}
                        </div>
                      )}

                      <div className="flex items-center justify-between text-xs text-slate-600 dark:text-slate-300">
                        <span>{item.reporterName} ({item.reporterID})</span>
                        <span>{formatReadableDate(item.date)}</span>
                      </div>
                      <div className="flex items-center justify-between gap-2 pt-1">
                        <select
                          aria-label={`Change status for ${item.ID}`}
                          value={item.status}
                          onChange={(e) => onQuickStatusChange(item.ID, e.target.value)}
                          className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100"
                        >
                          {SEED_CONFIG.ITEM_STATUSES.map((st) => (
                            <option key={st} value={st}>{st}</option>
                          ))}
                        </select>
                        <div className="flex items-center gap-1.5">
                          <button
                            type="button"
                            onClick={() => onViewDetails(item)}
                            className="px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200"
                          >
                            View
                          </button>
                          <button
                            type="button"
                            onClick={() => onOpenEdit(item)}
                            className="px-2.5 py-1.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/70 text-xs font-semibold text-indigo-700 dark:text-indigo-300"
                          >
                            Edit
                          </button>
                          <button
                            type="button"
                            onClick={() => onRequestDelete(item)}
                            className="px-2.5 py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/70 text-xs font-semibold text-rose-700 dark:text-rose-300"
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </section>

          {/* Global Campus Audit History */}
          <section className="bg-white/40 dark:bg-slate-900/40 backdrop-blur-lg rounded-2xl border border-white/30 dark:border-slate-700/50 shadow-xl overflow-hidden transition-colors">
            <div className="p-4 sm:p-5 border-b border-white/30 dark:border-slate-700/50 flex items-center justify-between gap-2">
              <div>
                <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                  <Icon name="clock" className="w-4 h-4 text-indigo-700 dark:text-indigo-400" />
                  Global Audit History
                </h3>
                <p className="text-xs text-slate-600 dark:text-slate-300">
                  Chronological log of all reports, claims, verifications, and status changes stored in LocalStorage.
                </p>
              </div>
              <span className="text-xs font-semibold text-slate-700 dark:text-slate-200 bg-white/55 dark:bg-slate-800/60 border border-white/40 dark:border-slate-700/50 px-3 py-1 rounded-full">
                {auditEvents.length} event{auditEvents.length === 1 ? "" : "s"}
              </span>
            </div>

            {auditEvents.length === 0 ? (
              <div className="p-8 text-center text-sm text-slate-600 dark:text-slate-300">
                No audit events recorded yet.
              </div>
            ) : (
              <div className="divide-y divide-white/25 dark:divide-slate-700/40 max-h-80 overflow-y-auto custom-scrollbar">
                {auditEvents.map((ev) => {
                  const targetItem = items.find((i) => i.ID === ev.itemID);
                  return (
                    <div
                      key={ev.key}
                      className="px-4 sm:px-5 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-white/40 dark:hover:bg-slate-800/40"
                    >
                      <div className="space-y-0.5">
                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            type="button"
                            onClick={() => targetItem && onViewDetails(targetItem)}
                            disabled={!targetItem}
                            className="font-mono text-xs font-bold text-indigo-700 dark:text-indigo-400 hover:underline disabled:text-slate-400 dark:disabled:text-slate-600"
                          >
                            {ev.itemID}
                          </button>
                          <span className="text-xs font-semibold text-slate-800 dark:text-slate-200">{ev.itemName}</span>
                          <StatusBadge status={ev.status} />
                        </div>
                        <p className="text-xs text-slate-600 dark:text-slate-300">{ev.note}</p>
                      </div>
                      <div className="text-left sm:text-right shrink-0 text-[11px] text-slate-500 dark:text-slate-400">
                        <div className="font-semibold text-slate-700 dark:text-slate-300">{ev.actor}</div>
                        <div>{formatTimestamp(ev.timestamp)}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        </div>
      );
    }

    // =========================================================================
    // Modal: Report New Lost / Found Item
    // =========================================================================
    function getLocalTodayDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function ReportModal({ initialType, studentProfile, onClose, onCreated, onCopyID, onErrorToast }) {
      const today = getLocalTodayDate();
      const [form, setForm] = useState({
        type: initialType || "Lost",
        category: "Electronics",
        itemName: "",
        location: "",
        description: "",
        reporterName: studentProfile && studentProfile.name ? studentProfile.name : "",
        reporterID: studentProfile && studentProfile.id ? studentProfile.id : "",
        date: today
      });
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [photoError, setPhotoError] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState("");
      const [createdItem, setCreatedItem] = useState(null);
      const [aiMatchResult, setAiMatchResult] = useState(null);

      async function handleFileChosen(file) {
        if (!file) return;
        if (!file.type || !file.type.startsWith("image/")) {
          const msg = "Please select an image file (JPG, PNG, WebP, or GIF).";
          setPhotoError(msg);
          if (onErrorToast) onErrorToast(msg);
          return;
        }
        try {
          const dataUrl = await readFileAsDataURL(file);
          setSelectedFile(file);
          setPreviewUrl(dataUrl);
          setPhotoError("");
        } catch (err) {
          const msg = err && err.message ? err.message : "Could not load selected image.";
          setPhotoError(msg);
          if (onErrorToast) onErrorToast(msg);
        }
      }

      function handleClearPhoto() {
        setSelectedFile(null);
        setPreviewUrl("");
        setPhotoError("");
      }

      async function handleSubmit(e) {
        e.preventDefault();
        if (isSubmitting) return;
        setError("");
        setPhotoError("");

        let imageData = "";
        if (selectedFile) {
          setIsSubmitting(true);
          try {
            const compressed = await compressImageWithCanvas(selectedFile);
            imageData = compressed.dataUrl;
          } catch (err) {
            const msg = err && err.message ? err.message : "Could not compress uploaded image.";
            setError(msg);
            setIsSubmitting(false);
            if (onErrorToast) onErrorToast(msg);
            return;
          }
        }

        const res = API.createItem({ ...form, imageData });
        setIsSubmitting(false);

        if (!res.ok) {
          setError(res.error);
          if (onErrorToast) onErrorToast(res.error);
          return;
        }

        setError("");
        setSelectedFile(null);
        setPreviewUrl("");
        const aiCheck = typeof runTraceAI === "function" ? runTraceAI(res.data) : { hasMatch: false, matches: [] };
        setAiMatchResult(aiCheck);
        setCreatedItem(res.data);
        onCreated(res.data, aiCheck);
      }

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-900/45 dark:bg-slate-950/65 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white/75 dark:bg-slate-900/65 backdrop-blur-xl rounded-3xl max-w-xl w-full shadow-2xl border border-white/40 dark:border-slate-700/50 overflow-hidden animate-fade-slide my-auto"
          >
            <div className="px-6 py-4 bg-white/40 dark:bg-slate-800/40 border-b border-white/30 dark:border-slate-700/50 flex items-center justify-between">
              <div>
                <p className="text-[11px] font-bold uppercase tracking-wider text-indigo-700 dark:text-indigo-300">
                  Trace by MITE
                </p>
                <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">
                  {createdItem ? "Report Submitted Successfully" : "Report Lost or Found Item"}
                </h3>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/60 dark:hover:bg-slate-700/60"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            {createdItem ? (
              <div className="p-6 text-center space-y-5">
                {createdItem.imageData ? (
                  <img
                    src={createdItem.imageData}
                    alt={createdItem.itemName}
                    className="w-24 h-24 mx-auto rounded-2xl object-cover border border-slate-200 dark:border-slate-700 shadow-sm"
                  />
                ) : (
                  <div className="w-14 h-14 mx-auto rounded-2xl bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 flex items-center justify-center">
                    <Icon name="check" className="w-8 h-8" />
                  </div>
                )}
                <div className="space-y-1">
                  <p className="text-sm text-slate-600 dark:text-slate-300">
                    Your <strong className="text-slate-900 dark:text-white">{createdItem.type}</strong> report for{" "}
                    <strong className="text-slate-900 dark:text-white">{createdItem.itemName}</strong> has been saved to the Trace by MITE registry.
                  </p>
                  <p className="text-xs text-slate-500 dark:text-slate-400">Save your unique tracking ID below:</p>
                </div>
                <div className="inline-flex items-center gap-3 px-4 py-2.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/70 border border-indigo-200 dark:border-indigo-800/70">
                  <span className="font-mono text-lg font-extrabold text-indigo-800 dark:text-indigo-300">{createdItem.ID}</span>
                  <button
                    type="button"
                    onClick={() => onCopyID(createdItem.ID)}
                    className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-700 text-xs font-semibold hover:bg-indigo-100 dark:hover:bg-slate-800"
                  >
                    <Icon name="copy" className="w-3.5 h-3.5" />
                    Copy
                  </button>
                </div>
                {aiMatchResult && aiMatchResult.hasMatch && aiMatchResult.bestMatch && (
                  <div className="ai-badge-glow text-left p-3.5 rounded-2xl bg-gradient-to-r from-indigo-600/15 via-violet-600/15 to-fuchsia-600/15 border border-indigo-400/50 dark:border-violet-500/60 space-y-1.5">
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                      <p className="text-xs font-extrabold text-indigo-900 dark:text-indigo-200 flex items-center gap-1.5">
                        <Icon name="sparkles" className="w-4 h-4 text-indigo-600 dark:text-indigo-300 shrink-0" />
                        🤖 Trace AI Potential Match Queued
                      </p>
                      <span className="px-2 py-0.5 rounded-full bg-indigo-600 text-white text-[10px] font-bold">
                        {aiMatchResult.bestMatch.matchScore}% Match
                      </span>
                    </div>
                    <p className="text-xs text-slate-700 dark:text-slate-200">
                      Matches <strong className="font-mono">{aiMatchResult.bestMatch.ID}</strong> ({aiMatchResult.bestMatch.type} — {aiMatchResult.bestMatch.itemName} at {aiMatchResult.bestMatch.location}). Flagged for Security Admin verification!
                    </p>
                  </div>
                )}
                <div className="flex gap-2.5 pt-2">
                  <button
                    type="button"
                    onClick={() => {
                      setCreatedItem(null);
                      setAiMatchResult(null);
                      handleClearPhoto();
                      setForm({
                        type: form.type,
                        category: "Electronics",
                        itemName: "",
                        location: "",
                        description: "",
                        reporterName: form.reporterName || (studentProfile && studentProfile.name) || "",
                        reporterID: form.reporterID || (studentProfile && studentProfile.id) || "",
                        date: today
                      });
                    }}
                    className="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800"
                  >
                    Report Another
                  </button>
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold"
                  >
                    Done
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[82vh] overflow-y-auto custom-scrollbar">
                {/* Lost / Found Switcher */}
                <div className="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  {SEED_CONFIG.ITEM_TYPES.map((t) => (
                    <button
                      key={t}
                      type="button"
                      onClick={() => setForm({ ...form, type: t })}
                      className={`py-2 rounded-lg text-sm font-bold transition-all ${
                        form.type === t
                          ? t === "Lost"
                            ? "bg-rose-600 text-white shadow-sm"
                            : "bg-emerald-600 text-white shadow-sm"
                          : "text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white"
                      }`}
                    >
                      {t === "Lost" ? "I Lost Something" : "I Found Something"}
                    </button>
                  ))}
                </div>

                {error && (
                  <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800/70 text-xs font-semibold text-rose-700 dark:text-rose-300">
                    {error}
                  </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      Item Name *
                    </label>
                    <input
                      type="text"
                      value={form.itemName}
                      onChange={(e) => setForm({ ...form, itemName: e.target.value })}
                      placeholder="e.g. Casio Calculator fx-991CW"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      Category *
                    </label>
                    <select
                      value={form.category}
                      onChange={(e) => setForm({ ...form, category: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      {SEED_CONFIG.CATEGORIES.map((cat) => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                  <div className="sm:col-span-2">
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      Campus Location *
                    </label>
                    <input
                      type="text"
                      value={form.location}
                      onChange={(e) => setForm({ ...form, location: e.target.value })}
                      placeholder="e.g. Central Library - 1st Floor"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      Date *
                    </label>
                    <input
                      type="date"
                      value={form.date}
                      onChange={(e) => setForm({ ...form, date: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>
                </div>

                {/* Quick MITE Location Chips */}
                <div>
                  <span className="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1.5">
                    Quick Pick MITE Location:
                  </span>
                  <div className="flex flex-wrap gap-1.5">
                    {SEED_CONFIG.MITE_LOCATIONS.slice(0, 6).map((loc) => (
                      <button
                        key={loc}
                        type="button"
                        onClick={() => setForm({ ...form, location: loc })}
                        className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/70 text-slate-700 dark:text-slate-300 hover:text-indigo-700 dark:hover:text-indigo-300 text-[11px] font-medium border border-slate-200 dark:border-slate-700 transition-colors"
                      >
                        {loc}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      Reporter Full Name *
                    </label>
                    <input
                      type="text"
                      value={form.reporterName}
                      onChange={(e) => setForm({ ...form, reporterName: e.target.value })}
                      placeholder="e.g. Sneha Hegde"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                      MITE USN / Staff ID *
                    </label>
                    <input
                      type="text"
                      value={form.reporterID}
                      onChange={(e) => setForm({ ...form, reporterID: e.target.value })}
                      placeholder="e.g. 4MT23IS025"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Identifying Description *
                  </label>
                  <textarea
                    rows={3}
                    value={form.description}
                    onChange={(e) => setForm({ ...form, description: e.target.value })}
                    placeholder="Color, brand, stickers, unique marks, or handover instructions..."
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required
                  />
                </div>

                {/* Drag & Drop Photo Upload */}
                <PhotoUploadField
                  selectedFile={selectedFile}
                  previewUrl={previewUrl}
                  existingImageUrl=""
                  onFileChosen={handleFileChosen}
                  onClearPhoto={handleClearPhoto}
                  errorMessage={photoError}
                />

                <div className="flex justify-end gap-2.5 pt-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white text-sm font-semibold shadow-sm"
                  >
                    {isSubmitting ? "Compressing & Saving..." : "Submit Report"}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Modal: Submit Claim / Sighting
    // =========================================================================
    function ClaimModal({ item, studentProfile, onClose, onSubmitted, onErrorToast }) {
      const [form, setForm] = useState({
        claimantName: studentProfile && studentProfile.name ? studentProfile.name : "",
        claimantID: studentProfile && studentProfile.id ? studentProfile.id : "",
        contactInfo: "",
        proofNote: ""
      });
      const [error, setError] = useState("");

      if (!item) return null;
      const isFound = item.type === "Found";

      function handleSubmit(e) {
        e.preventDefault();
        const res = API.submitClaim(item.ID, form);
        if (!res.ok) {
          setError(res.error);
          if (onErrorToast) onErrorToast(res.error);
          return;
        }
        onSubmitted(res.data);
      }

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-900/45 dark:bg-slate-950/65 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white/75 dark:bg-slate-900/65 backdrop-blur-xl rounded-3xl max-w-lg w-full shadow-2xl border border-white/40 dark:border-slate-700/50 overflow-hidden animate-fade-slide my-auto"
          >
            <div className="px-6 py-4 bg-white/40 dark:bg-slate-800/40 border-b border-white/30 dark:border-slate-700/50 flex items-center justify-between">
              <div>
                <p className="text-[11px] font-bold uppercase tracking-wider text-indigo-700 dark:text-indigo-300">
                  Trace by MITE • Verification
                </p>
                <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">
                  {isFound ? "Claim Found Item" : "Report Finding This Item"}
                </h3>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/60 dark:hover:bg-slate-700/60"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="p-3.5 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/50 border border-indigo-100 dark:border-indigo-800/60 text-xs space-y-1">
                <div className="flex items-center justify-between">
                  <span className="font-mono font-bold text-indigo-800 dark:text-indigo-300">{item.ID}</span>
                  <TypeBadge type={item.type} />
                </div>
                <p className="text-sm font-bold text-slate-900 dark:text-white">{item.itemName}</p>
                <p className="text-slate-600 dark:text-slate-300">{item.location}</p>
              </div>

              {error && (
                <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800/70 text-xs font-semibold text-rose-700 dark:text-rose-300">
                  {error}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Your Full Name *
                  </label>
                  <input
                    type="text"
                    value={form.claimantName}
                    onChange={(e) => setForm({ ...form, claimantName: e.target.value })}
                    placeholder="e.g. Pratham Rao"
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    Your MITE USN / ID *
                  </label>
                  <input
                    type="text"
                    value={form.claimantID}
                    onChange={(e) => setForm({ ...form, claimantID: e.target.value })}
                    placeholder="e.g. 4MT23CS045"
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  MITE Email or Phone *
                </label>
                <input
                  type="text"
                  value={form.contactInfo}
                  onChange={(e) => setForm({ ...form, contactInfo: e.target.value })}
                  placeholder="e.g. pratham.4mt23cs045@mite.ac.in or +91 98..."
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  {isFound ? "Proof of Ownership *" : "Where Found & Handover Note *"}
                </label>
                <textarea
                  rows={3}
                  value={form.proofNote}
                  onChange={(e) => setForm({ ...form, proofNote: e.target.value })}
                  placeholder={
                    isFound
                      ? "Describe hidden marks, lockscreen wallpaper, contents, or serial details..."
                      : "Share where you found it and which campus desk you deposited it at..."
                  }
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>

              <div className="flex justify-end gap-2.5 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-sm"
                >
                  Submit for Admin Verification
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // Modal: Item Details & Status Timeline
    // =========================================================================
    function ItemDetailModal({
      item,
      isAdminView,
      onClose,
      onOpenClaim,
      onResolveClaim,
      onEditItem,
      onSelectMatch,
      onCopyID
    }) {
      const potentialMatches = useMemo(() => {
        if (!item || item.status === "Resolved") return [];
        const res = API.getPotentialMatches(item.ID);
        return res.ok ? res.data : [];
      }, [item ? item.ID : null, item ? item.status : null]);

      if (!item) return null;

      const steps = ["Active", "Pending Claim", "Resolved"];
      const currentStepIdx = Math.max(0, steps.indexOf(item.status));

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-900/45 dark:bg-slate-950/65 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white/75 dark:bg-slate-900/65 backdrop-blur-xl rounded-3xl max-w-2xl w-full shadow-2xl border border-white/40 dark:border-slate-700/50 overflow-hidden animate-fade-slide my-auto"
          >
            <div className="px-6 py-4 bg-white/40 dark:bg-slate-800/40 border-b border-white/30 dark:border-slate-700/50 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5 flex-wrap">
                <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-indigo-500/15 dark:bg-indigo-400/15 text-indigo-800 dark:text-indigo-200 text-[11px] font-bold uppercase tracking-wider border border-indigo-300/40 dark:border-indigo-700/50">
                  Trace by MITE
                </span>
                <button
                  type="button"
                  onClick={() => onCopyID(item.ID)}
                  className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-white/70 dark:bg-slate-900/70 border border-white/40 dark:border-slate-700/60 font-mono text-xs font-extrabold text-indigo-700 dark:text-indigo-300 hover:bg-white dark:hover:bg-slate-800"
                >
                  <span>{item.ID}</span>
                  <Icon name="copy" className="w-3.5 h-3.5" />
                </button>
                <TypeBadge type={item.type} />
                <StatusBadge status={item.status} />
                {item.status === "Resolved" && item.autoResolvedByAI && (
                  <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-gradient-to-r from-emerald-500/20 to-indigo-500/20 text-emerald-800 dark:text-emerald-200 border border-emerald-400/45 text-xs font-bold">
                    ⚡ Auto-Resolved by AI{item.aiConfidence ? ` (${item.aiConfidence}%)` : ""}
                  </span>
                )}
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/60 dark:hover:bg-slate-700/60"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-6 space-y-5 max-h-[82vh] overflow-y-auto custom-scrollbar">
              {/* Attached Photo */}
              {item.imageData && (
                <div className="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80">
                  <img
                    src={item.imageData}
                    alt={item.itemName}
                    className="w-full max-h-72 object-contain mx-auto"
                  />
                </div>
              )}

              {/* Item Title & Description */}
              <div>
                <div className="flex items-center gap-1.5 text-xs font-semibold text-indigo-700 dark:text-indigo-400 mb-1">
                  <CategoryGlyph category={item.category} />
                  <span>{item.category}</span>
                </div>
                <h3 className="text-xl font-extrabold text-slate-900 dark:text-white">{item.itemName}</h3>
                <p className="mt-2 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">{item.description}</p>
              </div>

              {/* Workflow Stepper */}
              <div className="bg-white/45 dark:bg-slate-800/50 backdrop-blur-sm rounded-2xl p-4 border border-white/40 dark:border-slate-700/60">
                <p className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">
                  Recovery Workflow Progress
                </p>
                <div className="grid grid-cols-3 gap-2">
                  {steps.map((step, idx) => {
                    const reached = idx <= currentStepIdx;
                    return (
                      <div key={step} className="space-y-1.5">
                        <div
                          className={`h-2 rounded-full transition-colors ${
                            reached
                              ? item.status === "Resolved"
                                ? "bg-emerald-500"
                                : "bg-indigo-600"
                              : "bg-slate-200 dark:bg-slate-700"
                          }`}
                        />
                        <p
                          className={`text-xs font-semibold ${
                            reached ? "text-slate-900 dark:text-white" : "text-slate-400 dark:text-slate-500"
                          }`}
                        >
                          {idx + 1}. {step}
                        </p>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Core Metadata Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                <div className="p-3.5 rounded-xl border border-white/40 dark:border-slate-700/60 bg-white/45 dark:bg-slate-800/45 backdrop-blur-sm">
                  <span className="text-xs font-semibold text-slate-600 dark:text-slate-300 block">Campus Location</span>
                  <span className="font-semibold text-slate-900 dark:text-white mt-0.5 block">{item.location}</span>
                </div>
                <div className="p-3.5 rounded-xl border border-white/40 dark:border-slate-700/60 bg-white/45 dark:bg-slate-800/45 backdrop-blur-sm">
                  <span className="text-xs font-semibold text-slate-600 dark:text-slate-300 block">Reported Date</span>
                  <span className="font-semibold text-slate-900 dark:text-white mt-0.5 block">
                    {formatReadableDate(item.date)} ({item.date})
                  </span>
                </div>
                <div className="p-3.5 rounded-xl border border-white/40 dark:border-slate-700/60 bg-white/45 dark:bg-slate-800/45 backdrop-blur-sm">
                  <span className="text-xs font-semibold text-slate-600 dark:text-slate-300 block">Reporter Name</span>
                  <span className="font-semibold text-slate-900 dark:text-white mt-0.5 block">{item.reporterName}</span>
                </div>
                <div className="p-3.5 rounded-xl border border-white/40 dark:border-slate-700/60 bg-white/45 dark:bg-slate-800/45 backdrop-blur-sm">
                  <span className="text-xs font-semibold text-slate-600 dark:text-slate-300 block">Reporter ID / USN</span>
                  <span className="font-mono font-bold text-slate-900 dark:text-white mt-0.5 block">{item.reporterID}</span>
                </div>
              </div>

              {/* Claim Info if present */}
              {item.claimInfo && (
                <div className="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/35 border border-amber-200 dark:border-amber-800/60 space-y-1.5 text-xs">
                  <p className="font-bold text-amber-950 dark:text-amber-200 text-sm">
                    Submitted Claim / Handover Details
                  </p>
                  <p className="text-amber-900 dark:text-amber-100/90">
                    <strong>Name:</strong> {item.claimInfo.claimantName} ({item.claimInfo.claimantID})
                  </p>
                  <p className="text-amber-900 dark:text-amber-100/90">
                    <strong>Contact:</strong> {item.claimInfo.contactInfo}
                  </p>
                  <p className="text-amber-900 dark:text-amber-100/90">
                    <strong>Verification Proof:</strong> {item.claimInfo.proofNote}
                  </p>
                </div>
              )}

              {/* Admin Notes */}
              {item.adminNotes && (
                <div className="p-3.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-700 dark:text-slate-300">
                  <strong className="text-slate-900 dark:text-white">Admin Note:</strong> {item.adminNotes}
                </div>
              )}

              {/* Linked AI Match Record */}
              {item.linkedMatchID && (
                <div className="p-4 rounded-2xl bg-gradient-to-r from-emerald-500/15 via-indigo-500/15 to-sky-500/15 border border-emerald-400/45 dark:border-emerald-600/50 flex flex-wrap items-center justify-between gap-3">
                  <div className="space-y-0.5">
                    <p className="text-xs font-extrabold text-emerald-900 dark:text-emerald-200 flex items-center gap-1.5">
                      <Icon name="sparkles" className="w-4 h-4 text-emerald-600 dark:text-emerald-300" />
                      Trace AI Linked Record ({item.aiConfidence ? `${item.aiConfidence}% Confidence` : "Linked"})
                    </p>
                    <p className="text-xs text-slate-700 dark:text-slate-200">
                      Paired Counterpart ID: <strong className="font-mono text-indigo-800 dark:text-indigo-200">{item.linkedMatchID}</strong>
                    </p>
                  </div>
                  {onSelectMatch && (
                    <button
                      type="button"
                      onClick={() => onSelectMatch({ ID: item.linkedMatchID })}
                      className="px-3 py-1.5 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-emerald-400/40 text-xs font-bold text-indigo-700 dark:text-indigo-300 hover:bg-white dark:hover:bg-slate-800 transition-colors"
                    >
                      Inspect {item.linkedMatchID} →
                    </button>
                  )}
                </div>
              )}

              {/* Smart Potential Matches */}
              {potentialMatches.length > 0 && (
                <div className="p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800/60 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-indigo-900 dark:text-indigo-200">
                      Potential {item.type === "Lost" ? "Found" : "Lost"} Matches ({potentialMatches.length})
                    </h4>
                    <span className="text-[11px] font-medium text-indigo-700 dark:text-indigo-300">
                      Matched by category &amp; keywords
                    </span>
                  </div>
                  <div className="space-y-2">
                    {potentialMatches.map((match) => (
                      <button
                        key={match.ID}
                        type="button"
                        onClick={() => onSelectMatch && onSelectMatch(match)}
                        className="w-full text-left p-2.5 rounded-xl bg-white dark:bg-slate-900 hover:bg-indigo-50 dark:hover:bg-slate-800 border border-indigo-100 dark:border-indigo-800/50 flex items-center justify-between gap-2 transition-colors"
                      >
                        <div className="min-w-0">
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-[11px] font-bold text-indigo-700 dark:text-indigo-400">{match.ID}</span>
                            <TypeBadge type={match.type} />
                            <StatusBadge status={match.status} />
                          </div>
                          <p className="text-xs font-bold text-slate-900 dark:text-white truncate mt-1">{match.itemName}</p>
                          <p className="text-[11px] text-slate-500 dark:text-slate-400 truncate">{match.location}</p>
                        </div>
                        <span className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 shrink-0">Inspect →</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Audit Timeline */}
              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2.5">
                  Activity Timeline
                </h4>
                <div className="space-y-2.5 border-l-2 border-slate-200 dark:border-slate-700 pl-4 ml-1.5">
                  {(item.history || []).map((entry, idx) => (
                    <div key={idx} className="relative text-xs">
                      <span className="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-indigo-500 ring-4 ring-white dark:ring-slate-900" />
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="font-bold text-slate-900 dark:text-white">{entry.status}</span>
                        <span className="text-slate-400 dark:text-slate-500">•</span>
                        <span className="text-slate-600 dark:text-slate-300 font-medium">{entry.actor}</span>
                        <span className="text-slate-400 dark:text-slate-500 ml-auto">{formatTimestamp(entry.timestamp)}</span>
                      </div>
                      <p className="text-slate-600 dark:text-slate-300 mt-0.5">{entry.note}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="px-6 py-4 bg-white/40 dark:bg-slate-800/40 border-t border-white/30 dark:border-slate-700/50 flex flex-wrap items-center justify-between gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700"
              >
                Close
              </button>

              <div className="flex items-center gap-2 flex-wrap">
                {isAdminView && onEditItem && (
                  <button
                    type="button"
                    onClick={() => {
                      onClose();
                      onEditItem(item);
                    }}
                    className="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-semibold"
                  >
                    Edit Record
                  </button>
                )}

                {item.status === "Active" && (
                  <button
                    type="button"
                    onClick={() => {
                      onClose();
                      onOpenClaim(item);
                    }}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold"
                  >
                    {item.type === "Found" ? "Claim This Item" : "I Found This Item"}
                  </button>
                )}

                {isAdminView && item.status === "Pending Claim" && (
                  <>
                    <button
                      type="button"
                      onClick={() => {
                        onResolveClaim(item.ID, "reject");
                        onClose();
                      }}
                      className="px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-rose-200 dark:border-rose-800/70 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/60 text-sm font-semibold"
                    >
                      Reject Claim
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        onResolveClaim(item.ID, "approve");
                        onClose();
                      }}
                      className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold"
                    >
                      Approve &amp; Resolve
                    </button>
                  </>
                )}
              </div>
            </div>
          </div>
        </div>

    // =========================================================================
    // Modal: Admin Edit Record
    // =========================================================================
    function AdminEditModal({ item, onClose, onSaved, onErrorToast }) {
      const [form, setForm] = useState({
        type: item.type,
        category: item.category,
        itemName: item.itemName,
        location: item.location,
        date: item.date,
        reporterName: item.reporterName,
        reporterID: item.reporterID,
        status: item.status,
        description: item.description,
        adminNotes: item.adminNotes || ""
      });
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [photoRemoved, setPhotoRemoved] = useState(false);
      const [photoError, setPhotoError] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState("");

      async function handleFileChosen(file) {
        if (!file) return;
        if (!file.type || !file.type.startsWith("image/")) {
          const msg = "Please select a valid image file (JPG, PNG, WebP, or GIF).";
          setPhotoError(msg);
          if (onErrorToast) onErrorToast(msg);
          return;
        }
        try {
          const dataUrl = await readFileAsDataURL(file);
          setSelectedFile(file);
          setPreviewUrl(dataUrl);
          setPhotoRemoved(false);
          setPhotoError("");
        } catch (err) {
          const msg = err && err.message ? err.message : "Could not load selected image.";
          setPhotoError(msg);
          if (onErrorToast) onErrorToast(msg);
        }
      }

      function handleClearPhoto() {
        setSelectedFile(null);
        setPreviewUrl("");
        setPhotoRemoved(true);
        setPhotoError("");
      }

      async function handleSubmit(e) {
        e.preventDefault();
        if (isSubmitting) return;
        setError("");
        setPhotoError("");

        const updates = { ...form };
        if (selectedFile) {
          setIsSubmitting(true);
          try {
            const compressed = await compressImageWithCanvas(selectedFile);
            updates.imageData = compressed.dataUrl;
          } catch (err) {
            const msg = err && err.message ? err.message : "Could not compress selected photo.";
            setError(msg);
            setIsSubmitting(false);
            if (onErrorToast) onErrorToast(msg);
            return;
          }
        } else if (photoRemoved) {
          updates.imageData = "";
        }

        const res = API.updateItem(item.ID, updates);
        setIsSubmitting(false);
        if (!res.ok) {
          setError(res.error);
          if (onErrorToast) onErrorToast(res.error);
          return;
        }
        onSaved(res.data);
      }

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-900/45 dark:bg-slate-950/65 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto"

              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar">

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

                  >
                    {SEED_CONFIG.ITEM_TYPES.map((t) => (

    function ToastNotificationStack({ toasts, onDismiss }) {

      return (
        <div
          aria-live="polite"
          aria-atomic="false"
          className="fixed bottom-5 right-5 z-[60] flex flex-col gap-2.5 w-[calc(100%-2.5rem)] sm:w-96 pointer-events-none"
        >
          {toasts.map((toast) => {
            const isError = toast.tone === "error";
            const isInfo = toast.tone === "info";
            const isAI = toast.tone === "ai";
            return (
              <div
                key={toast.id}
                role="status"
                className={`pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-lg flex items-center gap-3 ${
                  isAI
                    ? "ai-toast-glow bg-gradient-to-r from-indigo-600/90 via-violet-600/90 to-fuchsia-600/85 text-white border-indigo-200/70 dark:border-violet-400/70"

                      ? "animate-toast-in bg-rose-500/20 dark:bg-rose-950/60 text-rose-950 dark:text-rose-50 border-rose-400/50 dark:border-rose-700/60"
                      : "animate-toast-in bg-white/40 dark:bg-slate-900/40 text-slate-900 dark:text-white border-white/30 dark:border-slate-700/50"
                }`}
              >
                <span
                  className={`w-7 h-7 rounded-xl flex items-center justify-center shrink-0 border ${
                    isAI
                      ? "bg-white/20 text-amber-200 border-white/35"
                      : isError
                        ? "bg-rose-500/20 text-rose-700 dark:text-rose-300 border-rose-400/30"
                        : isInfo
                          ? "bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border-indigo-400/30"
                          : "bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border-emerald-400/30"
                  }`}
                >
                  <Icon name={isAI ? "sparkles" : isError ? "alert" : isInfo ? "info" : "check"} className="w-4 h-4" />
                </span>
                <p className="text-xs sm:text-sm font-semibold flex-1 leading-snug">{toast.message}</p>
                <button
                  type="button"
                  onClick={() => onDismiss(toast.id)}
                  aria-label="Dismiss notification"
                  className={`p-1 rounded-lg transition-colors shrink-0 ${
                    isAI
                      ? "text-white/80 hover:text-white hover:bg-white/20"

                  }`}

                </button>
              </div>
            );
          })}
        </div>
      );

    // =========================================================================
    // Root Application
    // =========================================================================
    function App() {
      const [authSession, setAuthSession] = useState(() => readStoredAuthSession());
      const [theme, setTheme] = useState(() => {
        try {
          const saved = localStorage.getItem(THEME_STORAGE_KEY);
          if (saved === "dark" || saved === "light") return saved;
        } catch (e) {}
        if (
          typeof document !== "undefined" &&
          document.documentElement.classList.contains("dark")
        ) {
          return "dark";
        }
        if (
          typeof window !== "undefined" &&
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          return "dark";
        }
        return "light";
      });

      const [items, setItems] = useState([]);
      const [stats, setStats] = useState({
        total: 0,
        lostCount: 0,
        foundCount: 0,
        activeCount: 0,
        pendingCount: 0,
        resolvedCount: 0,
        resolutionRate: 0,
        byCategory: []
      });

      const [reportModalType, setReportModalType] = useState(null);
      const [claimItem, setClaimItem] = useState(null);
      const [detailItemID, setDetailItemID] = useState(null);
      const [editItem, setEditItem] = useState(null);
      const [confirmConfig, setConfirmConfig] = useState(null);
      const [aiResolutionData, setAiResolutionData] = useState(null);
      const [toasts, setToasts] = useState([]);
      const toastTimersRef = useRef({});

      const dismissToast = useCallback((id) => {
        if (toastTimersRef.current[id]) {
          clearTimeout(toastTimersRef.current[id]);
          delete toastTimersRef.current[id];
        }
        setToasts((prev) => prev.filter((t) => t.id !== id));
      }, []);

      const showToast = useCallback((message, tone = "success") => {
        const id = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        setToasts((prev) => [...prev.slice(-3), { id, message, tone }]);
        toastTimersRef.current[id] = setTimeout(() => {
          delete toastTimersRef.current[id];
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3000);
      }, []);

      useEffect(() => {
        return () => {
          Object.values(toastTimersRef.current).forEach(clearTimeout);
          toastTimersRef.current = {};
        };
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", theme === "dark");
      }, [theme]);

      useEffect(() => {
        if (!window.matchMedia) return;
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        const handleSystemThemeChange = (e) => {
          try {
            if (!localStorage.getItem(THEME_STORAGE_KEY)) {
              setTheme(e.matches ? "dark" : "light");
            }
          } catch (err) {}
        };
        if (mq.addEventListener) {
          mq.addEventListener("change", handleSystemThemeChange);
          return () => mq.removeEventListener("change", handleSystemThemeChange);
        }
      }, []);

      function handleToggleTheme() {
        const nextTheme = theme === "dark" ? "light" : "dark";
        setTheme(nextTheme);
        try {
          localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        } catch (e) {}
        showToast(
          nextTheme === "dark" ? "Switched to Dark Mode" : "Switched to Light Mode",
          "info"
        );
      }

      function handleStudentLogin({ name, id }) {
        const cleanName = String(name || "").trim();
        const cleanId = String(id || "").trim().toUpperCase();
        if (cleanName.length < 2) {
          const msg = "Please enter your full name (at least 2 characters).";
          showToast(msg, "error");
          return { ok: false, error: msg };
        }
        if (cleanId.length < 3) {
          const msg = "Please enter a valid MITE USN / Roll No (at least 3 characters).";
          showToast(msg, "error");
          return { ok: false, error: msg };
        }
        const session = {
          role: "student",
          name: cleanName,
          id: cleanId
        };
        writeStoredAuthSession(session);
        setAuthSession(session);
        showToast(`Signed in as ${cleanName} (${cleanId})`, "success");
        return { ok: true, session };
      }

      function handleAdminLogin(pin) {
        const cleanPin = String(pin || "").trim();
        if (cleanPin !== ADMIN_SECURITY_PIN) {
          const msg = "Invalid Campus Security PIN. Access denied.";
          showToast(msg, "error");
          return { ok: false, error: msg };
        }
        const session = {
          role: "admin",
          name: "Campus Security Admin",
          id: "MITE-SEC-DESK"
        };
        writeStoredAuthSession(session);
        setAuthSession(session);
        showToast("Admin Console unlocked via Campus Security PIN.", "success");
        return { ok: true, session };
      }

      function handleLogout() {
        clearStoredAuthSession();
        setReportModalType(null);
        setClaimItem(null);
        setDetailItemID(null);
        setEditItem(null);
        setConfirmConfig(null);
        setAiResolutionData(null);
        setAuthSession(null);
        showToast("Signed out of Trace by MITE.", "info");
      }

      const refreshFromDB = useCallback(() => {
        const listRes = API.getItems();
        const statsRes = API.getStats();
        if (listRes.ok) setItems(listRes.data);
        if (statsRes.ok) setStats(statsRes.data);
      }, []);

      useEffect(() => {
        API.init();
        refreshFromDB();
        const unsubscribe = API.subscribe(refreshFromDB);
        return unsubscribe;
      }, [refreshFromDB]);

      useEffect(() => {
        function handleKeyDown(e) {
          if (e.key === "Escape") {
            setConfirmConfig(null);
            setAiResolutionData(null);
            setEditItem(null);
            setDetailItemID(null);
            setClaimItem(null);
            setReportModalType(null);
          }
        }
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      const detailItem = useMemo(
        () => items.find((i) => i.ID === detailItemID) || null,
        [items, detailItemID]
      );

      function handleCopyID(id) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(id).then(
            () => showToast(`Copied ID ${id} to clipboard`, "info"),
            () => showToast(`Tracking ID: ${id}`, "info")
          );
        } else {
          showToast(`Tracking ID: ${id}`, "info");
        }
      }

      function handleTrackById(id) {
        const res = API.getItemById(id);
        if (res.ok) {
          setDetailItemID(res.data.ID);
        }
        return res;
      }

      function handleResolveClaim(id, decision, adminNote = "") {
        const res = API.resolveClaim(id, decision, adminNote);
        if (res.ok) {
          refreshFromDB();
          showToast(
            decision === "approve"
              ? `${id} verified and marked Resolved.`
              : `Claim for ${id} rejected and reopened as Active.`
          );
        } else {
          showToast(res.error, "error");
        }
      }

      function handleResolveAIMatch(primaryItem, matchedItem) {
        if (!primaryItem || !matchedItem) return;
        const scoreLabel = matchedItem.matchScore ? ` at ${matchedItem.matchScore}% confidence` : "";
        const notePrimary = `Resolved via Trace AI match verification${scoreLabel} with ${matchedItem.ID} (${matchedItem.type}: ${matchedItem.itemName}).`;
        const noteMatched = `Resolved via Trace AI match verification${scoreLabel} with ${primaryItem.ID} (${primaryItem.type}: ${primaryItem.itemName}).`;

        const resPrimary = API.updateStatus(primaryItem.ID, "Resolved", notePrimary);
        const resMatched = API.updateStatus(matchedItem.ID, "Resolved", noteMatched);

        if (resPrimary.ok && resMatched.ok) {
          _linkAdminResolvedRecords(primaryItem.ID, matchedItem.ID, matchedItem.matchScore || null);
          refreshFromDB();
          showToast(`🤖 Trace AI Match Resolved: ${primaryItem.ID} & ${matchedItem.ID} marked Resolved.`, "ai");
        } else {
          refreshFromDB();
          showToast((resPrimary && resPrimary.error) || (resMatched && resMatched.error) || "Could not resolve AI match.", "error");
        }
      }

      function handleQuickStatusChange(id, nextStatus) {
        const res = API.updateStatus(id, nextStatus);
        if (res.ok) {
          refreshFromDB();
          showToast(`Status updated: ${id} is now ${nextStatus}.`);
        } else {
          showToast(res.error, "error");
        }
      }

      function handleRequestDelete(item) {
        setConfirmConfig({
          title: `Delete ${item.ID}?`,
          message: `Permanently remove "${item.itemName}" from the LocalStorage registry?`,
          confirmLabel: "Delete Record",
          danger: true,
          onConfirm: () => {
            const res = API.deleteItem(item.ID);
            if (res.ok) {
              refreshFromDB();
              showToast(`Deleted ${item.ID}.`);
            } else {
              showToast(res.error || "Could not delete record.", "error");
            }
            setConfirmConfig(null);
          }
        });
      }

      function handleResetDemo() {
        setConfirmConfig({
          title: "Reset Demo Database?",
          message:
            "This will restore the 3 initial Trace by MITE sample items (iQOO 12 Pro, MITE Library Card, Hostel & Two-Wheeler Keys) in LocalStorage.",
          confirmLabel: "Reset Demo Data",
          danger: false,
          onConfirm: () => {
            API.resetDemoData();
            refreshFromDB();
            showToast("Demo data restored in LocalStorage.");
            setConfirmConfig(null);
          }
        });
      }

      function handleExportJSON() {
        const blob = new Blob([JSON.stringify(items, null, 2)], {
          type: "application/json"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "trace-by-mite-export.json";
        link.click();
        URL.revokeObjectURL(url);
        showToast("Exported LocalStorage items as JSON.", "info");
      }

      function handleExportCSV() {
        exportToCSV(showToast);
      }

      useEffect(() => {
        _activeToastHandler = showToast;
        return () => {
          _activeToastHandler = null;
        };
      }, [showToast]);

      const isAdminView = Boolean(authSession && authSession.role === "admin");
      const studentProfile = authSession && authSession.role === "student" ? authSession : null;

      if (!authSession) {
        return (
          <div className="min-h-screen flex flex-col">
            <LoginLanding
              theme={theme}
              onToggleTheme={handleToggleTheme}
              onStudentLogin={handleStudentLogin}
              onAdminLogin={handleAdminLogin}
            />
            <ToastNotificationStack toasts={toasts} onDismiss={dismissToast} />
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar
            authSession={authSession}
            pendingCount={stats.pendingCount}
            onOpenReport={(type) => setReportModalType(type)}
            onLogout={handleLogout}
            theme={theme}
            onToggleTheme={handleToggleTheme}
          />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            {isAdminView ? (
              <AdminDashboard
                items={items}
                stats={stats}
                onResolveClaim={handleResolveClaim}
                onResolveAIMatch={handleResolveAIMatch}
                onQuickStatusChange={handleQuickStatusChange}
                onOpenEdit={(item) => setEditItem(item)}
                onRequestDelete={handleRequestDelete}
                onViewDetails={(item) => setDetailItemID(item.ID)}
                onResetDemo={handleResetDemo}
                onExportJSON={handleExportJSON}
                onExportCSV={handleExportCSV}
              />
            ) : (
              <StudentPortal
                items={items}
                stats={stats}
                onOpenReport={(type) => setReportModalType(type)}
                onViewDetails={(item) => setDetailItemID(item.ID)}
                onOpenClaim={(item) => setClaimItem(item)}
                onTrackById={handleTrackById}
                onCopyID={handleCopyID}
              />
            )}
          </main>

          <footer className="border-t border-white/30 dark:border-slate-700/50 bg-white/40 dark:bg-slate-900/40 backdrop-blur-lg mt-auto transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-600 dark:text-slate-300">
              <span>
                <strong className="text-slate-900 dark:text-white">Trace by MITE</strong> • College Hackathon Edition
              </span>
              <span>Simulated Backend: Persistent Browser LocalStorage • Role-Isolated Auth &amp; Trace AI</span>
            </div>
          </footer>

          {/* Modals */}
          {reportModalType && (
            <ReportModal
              initialType={reportModalType}
              studentProfile={studentProfile}
              onClose={() => setReportModalType(null)}
              onCreated={(item, aiResult) => {
                refreshFromDB();
                const aiCheck = aiResult || runTraceAI(item, { previewOnly: true });
                if (aiCheck && aiCheck.tier === 1 && aiCheck.autoResolved && aiCheck.matchedItem) {
                  const loc = aiCheck.matchedItem.location || item.location;
                  const score = aiCheck.score;
                  setReportModalType(null);
                  setAiResolutionData({
                    newItem: aiCheck.updatedNewItem || item,
                    matchedItem: aiCheck.matchedItem,
                    score,
                    location: loc
                  });
                  showToast(
                    `⚡ Trace AI Auto-Resolved (${score}% Match)! Your item matched with ${aiCheck.matchedItem.ID} at ${loc}. Proceed to the Admin Desk with your Tracking ID for instant handover.`,
                    "ai"
                  );
                } else if (aiCheck && aiCheck.hasMatch && aiCheck.bestMatch) {
                  showToast(`Item reported successfully! (${item.ID})`);
                  showToast(
                    `🤖 Trace AI (${aiCheck.score}% Match): Potential match with ${aiCheck.bestMatch.ID} is queued for Security Admin verification.`,
                    "ai"
                  );
                } else {
                  showToast(`Item reported successfully! (${item.ID})`);
                }
              }}
              onCopyID={handleCopyID}
              onErrorToast={(msg) => showToast(msg, "error")}
            />
          )}

          {aiResolutionData && (
            <TraceAIResolutionModal
              resolution={aiResolutionData}
              onClose={() => setAiResolutionData(null)}
              onInspectItem={(id) => {
                setAiResolutionData(null);
                setDetailItemID(id);
              }}
              onReportAnother={() => {
                const nextType = aiResolutionData.newItem ? aiResolutionData.newItem.type : "Lost";
                setAiResolutionData(null);
                setReportModalType(nextType);
              }}
              onCopyID={handleCopyID}
            />
          )}

          {claimItem && (
            <ClaimModal
              item={claimItem}
              studentProfile={studentProfile}
              onClose={() => setClaimItem(null)}
              onSubmitted={(updated) => {
                setClaimItem(null);
                refreshFromDB();
                showToast(`Claim submitted for ${updated.ID} — awaiting Admin review.`);
              }}
              onErrorToast={(msg) => showToast(msg, "error")}
            />
          )}

          {detailItem && (
            <ItemDetailModal
              item={detailItem}
              isAdminView={isAdminView}
              onClose={() => setDetailItemID(null)}
              onOpenClaim={(item) => setClaimItem(item)}
              onResolveClaim={handleResolveClaim}
              onEditItem={(item) => setEditItem(item)}
              onSelectMatch={(match) => {
                const target = items.find((i) => i.ID === (match && match.ID));
                if (target) {
                  setDetailItemID(target.ID);
                } else {
                  showToast("Linked record " + ((match && match.ID) || "") + " is no longer in registry.", "info");
                }
              }}
              onCopyID={handleCopyID}
            />
          )}

          {editItem && (
            <AdminEditModal
              item={editItem}
              onClose={() => setEditItem(null)}
              onSaved={(updated) => {
                setEditItem(null);
                refreshFromDB();
                showToast(`Saved changes to ${updated.ID}.`);
              }}
              onErrorToast={(msg) => showToast(msg, "error")}
            />
          )}

          <ConfirmModal
            config={confirmConfig}
            onCancel={() => setConfirmConfig(null)}
            onConfirm={() => confirmConfig && confirmConfig.onConfirm()}
          />

          {/* Sliding Toast Notification Stack */}
          <ToastNotificationStack toasts={toasts} onDismiss={dismissToast} />
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
