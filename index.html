  <!-- React SPA Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const API = window.MiteLostFoundAPI;
    if (typeof window.getItems !== "function") {
      window.getItems = function (filters = {}) {
        const res = API && typeof API.getItems === "function" ? API.getItems(filters) : { ok: true, data: [] };
        return res && res.ok ? res.data : [];
      };
    }

    function escapeCSVField(value) {
      const str = value == null ? "" : String(value);
      return /[",\r\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
    }

    let _activeToastHandler = null;

    function _performCSVExport(onNotify) {
      const raw = typeof window.getItems === "function"
        ? window.getItems()
        : (API && typeof API.getItems === "function" ? API.getItems() : []);
      const records = Array.isArray(raw)
        ? raw
        : (raw && Array.isArray(raw.data) ? raw.data : []);

      const headers = [
        "Tracking ID",
        "Type (Lost/Found)",
        "Category",
        "Item Name",
        "Location",
        "Status",
        "Reporter Name",
        "Date"
      ];

      const rows = records.map((item) => [
        escapeCSVField(item.ID),
        escapeCSVField(item.type),
        escapeCSVField(item.category),
        escapeCSVField(item.itemName),
        escapeCSVField(item.location),
        escapeCSVField(item.status),
        escapeCSVField(item.reporterName),
        escapeCSVField(item.date)
      ].join(","));

      const csvContent = [headers.join(","), ...rows].join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "trace-by-mite-report.csv";
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      const notifier = typeof onNotify === "function" ? onNotify : _activeToastHandler;
      if (typeof notifier === "function") {
        notifier(`CSV Report exported (${records.length} record${records.length === 1 ? "" : "s"}) to trace-by-mite-report.csv`, "success");
      }
      return csvContent;
    }

    function exportToCSV(onNotify) {
      return _performCSVExport(onNotify);
    }

    window.exportToCSV = exportToCSV;

    // =========================================================================
    // Unified Session Auth Helpers (sessionStorage Role Isolation)
    // =========================================================================
    const ADMIN_SECURITY_PIN = "MITE2026";
    const SESSION_KEYS = {
      ROLE: "traceRole",
      NAME: "traceName",
      ID: "traceID",
      USER: "traceUser"
    };

    function readStoredAuthSession() {
      try {
        const role = sessionStorage.getItem(SESSION_KEYS.ROLE);
        if (role !== "student" && role !== "admin") return null;
        const name = (sessionStorage.getItem(SESSION_KEYS.NAME) || "").trim();
        const id = (sessionStorage.getItem(SESSION_KEYS.ID) || "").trim().toUpperCase();
        if (role === "student" && (!name || !id)) return null;
        return {
          role,
          name: role === "admin" ? (name || "Campus Security Admin") : name,
          id: role === "admin" ? (id || "MITE-SEC-DESK") : id
        };
      } catch (e) {
        return null;
      }
    }

    function writeStoredAuthSession(session) {
      try {
        sessionStorage.setItem(SESSION_KEYS.ROLE, session.role);
        sessionStorage.setItem(SESSION_KEYS.NAME, session.name);
        sessionStorage.setItem(SESSION_KEYS.ID, session.id);
        sessionStorage.setItem(SESSION_KEYS.USER, JSON.stringify(session));
      } catch (e) {}
    }

    function clearStoredAuthSession() {
      try {
        sessionStorage.removeItem(SESSION_KEYS.ROLE);
        sessionStorage.removeItem(SESSION_KEYS.NAME);
        sessionStorage.removeItem(SESSION_KEYS.ID);
        sessionStorage.removeItem(SESSION_KEYS.USER);
      } catch (e) {}
    }

    // =========================================================================
    // "Trace AI" Confidence Scoring & >=90% Auto-Resolution Engine
    // =========================================================================
    const TRACE_AI_STORAGE_KEY = "mite_campus_lost_found_items_v1";
    const TRACE_AI_STOPWORDS = new Set([
      "a", "an", "the", "and", "or", "of", "in", "on", "at", "to", "for",
      "with", "from", "by", "near", "beside", "around", "inside", "outside",
      "is", "was", "are", "it", "its", "my", "our", "your", "lost", "found",
      "item", "items", "something", "mite", "campus", "floor", "room", "side",
      "left", "right", "kept", "put", "this", "that", "there", "here"
    ]);

    function normalizeTraceToken(token) {
      if (!token) return "";
      if (token.length > 3 && token.endsWith("s") && !token.endsWith("ss")) {
        return token.slice(0, -1);
      }
      return token;
    }

    function normalizeLocationPhrase(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function extractTraceKeywords(text) {
      if (!text) return [];
      const rawTokens = String(text)
        .toLowerCase()
        .split(/[^a-z0-9]+/)
        .filter((tok) => (tok.length >= 2 || /^\d+$/.test(tok)) && !TRACE_AI_STOPWORDS.has(tok))
        .map(normalizeTraceToken);
      return Array.from(new Set(rawTokens));
    }

    function calculateTraceLocationScore(locA, locB) {
      const normA = normalizeLocationPhrase(locA);
      const normB = normalizeLocationPhrase(locB);
      if (!normA || !normB) return { score: 0, sharedTokens: [] };
      if (normA === normB) {
        return { score: 30, sharedTokens: extractTraceKeywords(locA) };
      }

      const tokensA = extractTraceKeywords(locA);
      const tokensB = extractTraceKeywords(locB);
      if (tokensA.length === 0 || tokensB.length === 0) {
        return { score: 0, sharedTokens: [] };
      }

      const setB = new Set(tokensB);
      const sharedTokens = tokensA.filter((tok) => setB.has(tok));
      if (sharedTokens.length === 0) {
        return { score: 0, sharedTokens: [] };
      }

      const shorterNormLen = Math.min(normA.length, normB.length);
      const isContained =
        shorterNormLen >= 5 && (normA.includes(normB) || normB.includes(normA));

      const containment = sharedTokens.length / Math.min(tokensA.length, tokensB.length);
      const dice = (2 * sharedTokens.length) / (tokensA.length + tokensB.length);
      let rawScore = 30 * (0.7 * containment + 0.3 * dice);

      if (isContained) {
        rawScore = Math.max(rawScore, 27);
      }

      return {
        score: Math.min(30, Math.max(0, Math.round(rawScore))),
        sharedTokens
      };
    }

    function calculateTraceKeywordScore(itemA, itemB) {
      const nameTokA = extractTraceKeywords(itemA.itemName);
      const nameTokB = extractTraceKeywords(itemB.itemName);
      const descTokA = extractTraceKeywords(itemA.description);
      const descTokB = extractTraceKeywords(itemB.description);
      const allTokA = extractTraceKeywords(`${itemA.itemName || ""} ${itemA.description || ""}`);
      const allTokB = extractTraceKeywords(`${itemB.itemName || ""} ${itemB.description || ""}`);

      const nameSetB = new Set(nameTokB);
      const descSetB = new Set(descTokB);
      const allSetA = new Set(allTokA);
      const allSetB = new Set(allTokB);

      const sharedNameKeywords = nameTokA.filter((tok) => nameSetB.has(tok));
      const sharedDescKeywords = descTokA.filter((tok) => descSetB.has(tok));
      const sharedAllKeywords = allTokA.filter((tok) => allSetB.has(tok));

      if (sharedAllKeywords.length === 0) {
        return {
          score: 0,
          sharedNameKeywords: [],
          sharedDescKeywords: [],
          matchedKeywords: []
        };
      }

      let directNameRatio = 0;
      if (sharedNameKeywords.length > 0 && nameTokA.length > 0 && nameTokB.length > 0) {
        const nameContainment = sharedNameKeywords.length / Math.min(nameTokA.length, nameTokB.length);
        const nameDice = (2 * sharedNameKeywords.length) / (nameTokA.length + nameTokB.length);
        directNameRatio = 0.55 * nameContainment + 0.45 * nameDice;
      }

      let crossNameRatio = 0;
      if (nameTokA.length > 0 && nameTokB.length > 0) {
        const nameAInAllB = nameTokA.filter((t) => allSetB.has(t)).length / nameTokA.length;
        const nameBInAllA = nameTokB.filter((t) => allSetA.has(t)).length / nameTokB.length;
        crossNameRatio = 0.55 * Math.max(nameAInAllB, nameBInAllA);
      }

      const nameSubScore = Math.round(18 * Math.min(1, Math.max(directNameRatio, crossNameRatio)));

      let descSubScore = 0;
      if (sharedDescKeywords.length > 0 && descTokA.length > 0 && descTokB.length > 0) {
        const descContainment = sharedDescKeywords.length / Math.min(descTokA.length, descTokB.length);
        const descDice = (2 * sharedDescKeywords.length) / (descTokA.length + descTokB.length);
        descSubScore = Math.round(12 * Math.min(1, 0.8 * descContainment + 0.2 * descDice));
      }

      return {
        score: Math.min(30, Math.max(0, nameSubScore + descSubScore)),
        sharedNameKeywords,
        sharedDescKeywords,
        matchedKeywords: sharedAllKeywords
      };
    }

    function _commitTraceAIAutoResolution(primaryID, matchedID, confidenceScore, matchedLocation) {
      if (!primaryID || !matchedID) return { ok: false, reason: "missing-ids" };
      if (API && typeof API.init === "function") {
        API.init();
      }
      let records = null;
      try {
        const raw = localStorage.getItem(TRACE_AI_STORAGE_KEY);
        records = raw ? JSON.parse(raw) : null;
      } catch (e) {
        return { ok: false, reason: "storage-read-error" };
      }
      if (!Array.isArray(records)) {
        return { ok: false, reason: "invalid-records" };
      }

      const primaryIdx = records.findIndex((r) => r && r.ID === primaryID);
      const matchedIdx = records.findIndex((r) => r && r.ID === matchedID);
      if (primaryIdx === -1 || matchedIdx === -1) {
        return { ok: false, reason: "record-not-found" };
      }

      const primaryRec = records[primaryIdx];
      const matchedRec = records[matchedIdx];
      if (primaryRec.status !== "Active" || matchedRec.status !== "Active") {
        return { ok: false, alreadyResolved: true, reason: "not-active" };
      }

      const nowIso = new Date().toISOString();
      const score = Math.round(confidenceScore);

      const updatedPrimary = {
        ...primaryRec,
        status: "Resolved",
        autoResolvedByAI: true,
        resolutionLabel: "Auto-Resolved by AI",
        aiConfidence: score,
        linkedMatchID: matchedRec.ID,
        aiMatchedAt: nowIso,
        adminNotes: `Trace AI Auto-Resolved (${score}% confidence) with ${matchedRec.ID} at ${matchedLocation || matchedRec.location}.`,
        history: [
          ...(Array.isArray(primaryRec.history) ? primaryRec.history : []),
          {
            timestamp: nowIso,
            status: "Resolved",
            actor: "Trace AI Engine",
            note: `Auto-matched & resolved at ${score}% confidence with ${matchedRec.ID}`
          }
        ]
      };

      const updatedMatched = {
        ...matchedRec,
        status: "Resolved",
        autoResolvedByAI: true,
        resolutionLabel: "Auto-Resolved by AI",
        aiConfidence: score,
        linkedMatchID: primaryRec.ID,
        aiMatchedAt: nowIso,
        adminNotes: `Trace AI Auto-Resolved (${score}% confidence) with ${primaryRec.ID} at ${matchedRec.location}.`,
        history: [
          ...(Array.isArray(matchedRec.history) ? matchedRec.history : []),
          {
            timestamp: nowIso,
            status: "Resolved",
            actor: "Trace AI Engine",
            note: `Auto-matched & resolved at ${score}% confidence with ${primaryRec.ID}`
          }
        ]
      };

      const nextRecords = [...records];
      nextRecords[primaryIdx] = updatedPrimary;
      nextRecords[matchedIdx] = updatedMatched;

      try {
        localStorage.setItem(TRACE_AI_STORAGE_KEY, JSON.stringify(nextRecords));
      } catch (e) {
        return { ok: false, reason: "storage-write-error" };
      }

      window.dispatchEvent(new CustomEvent("mite-lf-db-updated"));
      return {
        ok: true,
        updatedNewItem: updatedPrimary,
        updatedMatchedItem: updatedMatched
      };
    }

    function _linkAdminResolvedRecords(primaryID, matchedID, confidenceScore) {
      try {
        const raw = localStorage.getItem(TRACE_AI_STORAGE_KEY);
        const records = raw ? JSON.parse(raw) : null;
        if (!Array.isArray(records)) return;
        const pIdx = records.findIndex((r) => r && r.ID === primaryID);
        const mIdx = records.findIndex((r) => r && r.ID === matchedID);
        if (pIdx === -1 || mIdx === -1) return;
        const nextRecords = [...records];
        nextRecords[pIdx] = {
          ...nextRecords[pIdx],
          linkedMatchID: matchedID,
          aiConfidence: confidenceScore || nextRecords[pIdx].aiConfidence || null
        };
        nextRecords[mIdx] = {
          ...nextRecords[mIdx],
          linkedMatchID: primaryID,
          aiConfidence: confidenceScore || nextRecords[mIdx].aiConfidence || null
        };
        localStorage.setItem(TRACE_AI_STORAGE_KEY, JSON.stringify(nextRecords));
        window.dispatchEvent(new CustomEvent("mite-lf-db-updated"));
      } catch (e) {}
    }

    function _executeTraceAI(newItem, options = {}) {
      if (!newItem || !newItem.type || !newItem.category) {
        return { ok: false, tier: 0, score: 0, hasMatch: false, autoResolved: false, matches: [], bestMatch: null };
      }

      const oppositeType = newItem.type === "Lost" ? "Found" : "Lost";
      const targetCategory = String(newItem.category).trim().toLowerCase();
      const previewOnly = Boolean(options.previewOnly);
      const includePending = Boolean(options.includePending);

      let pool = Array.isArray(options.items) ? options.items : null;
      if (!pool) {
        pool = typeof window.getItems === "function"
          ? window.getItems()
          : (API && typeof API.getItems === "function" ? API.getItems().data : []);
      }
      if (!Array.isArray(pool)) pool = [];

      const matches = [];

      pool.forEach((candidate) => {
        if (!candidate || candidate.ID === newItem.ID) return;
        if (candidate.type !== oppositeType) return;
        if (includePending) {
          if (candidate.status === "Resolved") return;
        } else if (candidate.status !== "Active") {
          return;
        }

        const candidateCategory = String(candidate.category || "").trim().toLowerCase();
        const categoryScore = candidateCategory === targetCategory ? 40 : 0;

        const locResult = calculateTraceLocationScore(newItem.location, candidate.location);
        const locationScore = locResult.score;

        const kwResult = calculateTraceKeywordScore(newItem, candidate);
        const keywordScore = kwResult.score;

        const matchScore = Math.min(100, Math.max(0, categoryScore + locationScore + keywordScore));
        if (matchScore < 50) return;

        matches.push({
          ...candidate,
          matchScore,
          confidenceScore: matchScore,
          categoryScore,
          locationScore,
          keywordScore,
          tier: matchScore >= 90 ? 1 : 2,
          sharedNameKeywords: kwResult.sharedNameKeywords,
          sharedDescKeywords: kwResult.sharedDescKeywords,
          sharedLocationKeywords: locResult.sharedTokens,
          matchedKeywords: Array.from(new Set([...kwResult.matchedKeywords, ...locResult.sharedTokens]))
        });
      });

      matches.sort((a, b) => b.matchScore - a.matchScore);
      const bestMatch = matches[0] || null;
      const topScore = bestMatch ? bestMatch.matchScore : 0;
      const tier = topScore >= 90 ? 1 : (topScore >= 50 ? 2 : 0);

      let autoResolved = false;
      let updatedNewItem = null;
      let updatedMatchedItem = null;

      if (!previewOnly && tier === 1 && bestMatch && newItem.ID) {
        const commitRes = _commitTraceAIAutoResolution(
          newItem.ID,
          bestMatch.ID,
          topScore,
          bestMatch.location || newItem.location
        );
        if (commitRes.ok) {
          autoResolved = true;
          updatedNewItem = commitRes.updatedNewItem;
          updatedMatchedItem = commitRes.updatedMatchedItem;
        }
      }

      return {
        ok: true,
        score: topScore,
        confidence: topScore,
        tier,
        hasMatch: matches.length > 0,
        autoResolved,
        matches,
        bestMatch: updatedMatchedItem ? { ...bestMatch, ...updatedMatchedItem } : bestMatch,
        matchedItem: updatedMatchedItem ? { ...bestMatch, ...updatedMatchedItem } : bestMatch,
        updatedNewItem
      };
    }

    function runTraceAI(newItem, options = {}) {
      return _executeTraceAI(newItem, options);
    }

    window.runTraceAI = runTraceAI;

    const THEME_STORAGE_KEY = "mite_campus_theme_v1";
    const SEED_CONFIG = window.MiteSeedData || {
      CATEGORIES: ["Electronics", "ID & Cards", "Keys", "Bags & Accessories", "Books & Stationery", "Clothing", "Other"],
      ITEM_TYPES: ["Lost", "Found"],
      ITEM_STATUSES: ["Active", "Pending Claim", "Resolved"],
      MITE_LOCATIONS: []
    };

    // =========================================================================
    // Image Reading & Canvas Compression Helpers (LocalStorage Quota Safe)
    // =========================================================================
    function formatBytes(bytes) {
      if (!bytes || bytes < 1024) return `${bytes || 0} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === "string") {
            resolve(reader.result);
          } else {
            reject(new Error("Could not read selected image file."));
          }
        };
        reader.onerror = () => reject(new Error("Failed to read selected image file."));
        reader.readAsDataURL(file);
      });
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Unsupported or corrupted image file."));
        img.src = src;
      });
    }

    function renderResizedJpeg(img, maxDimension, quality) {
      const srcWidth = img.naturalWidth || img.width || 800;
      const srcHeight = img.naturalHeight || img.height || 600;
      const scale = Math.min(1, maxDimension / Math.max(srcWidth, srcHeight));
      const targetWidth = Math.max(1, Math.round(srcWidth * scale));
      const targetHeight = Math.max(1, Math.round(srcHeight * scale));

      const canvas = document.createElement("canvas");
      canvas.width = targetWidth;
      canvas.height = targetHeight;

      const ctx = canvas.getContext("2d");
      if (!ctx) {
        throw new Error("Canvas image compression is unavailable in this browser.");
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, targetWidth, targetHeight);
      ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

      return {
        dataUrl: canvas.toDataURL("image/jpeg", quality),
        width: targetWidth,
        height: targetHeight
      };
    }

    async function compressImageWithCanvas(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        throw new Error("Please select a valid image file (JPG, PNG, WebP, or GIF).");
      }

      const rawDataUrl = await readFileAsDataURL(file);
      const img = await loadImageElement(rawDataUrl);

      let result = renderResizedJpeg(img, 800, 0.72);
      if (result.dataUrl.length > 240000) {
        result = renderResizedJpeg(img, 640, 0.56);
      }

      return {
        dataUrl: result.dataUrl,
        width: result.width,
        height: result.height,
        originalBytes: file.size,
        compressedBytes: Math.round((result.dataUrl.length * 3) / 4)
      };
    }

    function PhotoUploadField({
      selectedFile,
      previewUrl,
      existingImageUrl,
      onFileChosen,
      onClearPhoto,
      errorMessage
    }) {
      const fileInputRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      const activePreview = previewUrl || existingImageUrl || "";

      function handleFiles(fileList) {
        if (!fileList || fileList.length === 0) return;
        onFileChosen(fileList[0]);
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        if (!isDragging) setIsDragging(true);
      }

      function handleDragLeave(e) {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
      }

      function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(false);
        if (e.dataTransfer && e.dataTransfer.files) {
          handleFiles(e.dataTransfer.files);
        }
      }

      return (
        <div className="space-y-2">
          <div className="flex items-center justify-between">
            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300">
              Item Photo <span className="text-slate-400 dark:text-slate-500 font-normal">(Optional • Auto-compressed)</span>
            </label>
            {activePreview && (
              <button
                type="button"
                onClick={onClearPhoto}
                className="text-[11px] font-semibold text-rose-600 dark:text-rose-400 hover:underline"
              >
                Remove Photo
              </button>
            )}
          </div>

          <input
            ref={fileInputRef}
            type="file"
            accept="image/*"
            onChange={(e) => {
              handleFiles(e.target.files);
              e.target.value = "";
            }}
            className="hidden"
          />

          {activePreview ? (
            <div className="flex items-center gap-3.5 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70">
              <img
                src={activePreview}
                alt="Selected item preview"
                className="w-20 h-20 rounded-xl object-cover border border-slate-200 dark:border-slate-700 shrink-0 bg-white dark:bg-slate-900"
              />
              <div className="min-w-0 flex-1 space-y-1">
                <p className="text-xs font-bold text-slate-900 dark:text-white truncate">
                  {selectedFile ? selectedFile.name : "Attached item photo"}
                </p>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  {selectedFile
                    ? `Original size: ${formatBytes(selectedFile.size)} • Will be resized & compressed on submit`
                    : "Stored compressed in LocalStorage"}
                </p>
                <div className="flex items-center gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-600 text-[11px] font-semibold text-slate-700 dark:text-slate-200 hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
                  >
                    <Icon name="photo" className="w-3.5 h-3.5" />
                    Replace Photo
                  </button>
                </div>
              </div>
            </div>
          ) : (
            <div
              role="button"
              tabIndex={0}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              onKeyDown={(e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  fileInputRef.current && fileInputRef.current.click();
                }
              }}
              onDragOver={handleDragOver}
              onDragEnter={handleDragOver}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop}
              className={`group rounded-2xl border-2 border-dashed px-4 py-5 text-center cursor-pointer transition-all ${
                isDragging
                  ? "border-indigo-500 bg-indigo-50/80 dark:bg-indigo-950/40"

    function formatReadableDate(dateStr) {
      if (!dateStr) return "-";
      const parsed = new Date(dateStr + "T00:00:00");
      if (Number.isNaN(parsed.getTime())) return dateStr;
      return parsed.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function formatTimestamp(isoStr) {
      if (!isoStr) return "";
      const parsed = new Date(isoStr);
      if (Number.isNaN(parsed.getTime())) return isoStr;
      return parsed.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function StudentPortal({

      const [search, setSearch] = useState("");

      const [categoryFilter, setCategoryFilter] = useState("All");

      const [trackInput, setTrackInput] = useState("");

      const filteredItems = useMemo(() => {

          search,
          type: typeFilter,

          status: statusFilter,
          sort: sortOrder

        setTypeFilter("All");

        e.preventDefault();
        const trimmed = trackInput.trim();

          return;

            <div className="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">

                <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight leading-tight">

                  <button
                    type="button"
                    onClick={() => onOpenReport("Lost")}

                  >
                    <Icon name="plus" className="w-4 h-4" />
                    Report Lost Item

                  <button
                    type="button"
                    onClick={() => onOpenReport("Found")}
                    className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow-sm transition-colors"

                    <Icon name="plus" className="w-4 h-4" />

              </div>

                    <h3 className="text-sm font-bold text-white">
                      Quick Track by Item ID

                    <p className="text-xs text-slate-300 mt-0.5">

                  </div>
                  <div className="flex gap-2">
                    <input

                      value={trackInput}

                    />

              <p className="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Looking for owners / finders</p>

            <div className="bg-white/40 dark:bg-slate-900/40 backdrop-blur-lg rounded-2xl border border-white/30 dark:border-slate-700/50 p-4 shadow-xl transition-colors">

              <p className="text-xs font-semibold text-amber-700 dark:text-amber-400 uppercase tracking-wider">Pending / Resolved</p>

                {stats.pendingCount} <span className="text-slate-400 dark:text-slate-500 font-normal">/</span>{" "}
                <span className="text-emerald-700 dark:text-emerald-400">{stats.resolvedCount}</span>
              </p>
              <p className="text-xs text-slate-600 dark:text-slate-300 mt-0.5">In verification / reunited</p>
            </div>
          </section>

          {/* Search & Filter Toolbar */}
          <section className="bg-white/40 dark:bg-slate-900/40 backdrop-blur-lg rounded-2xl border border-white/30 dark:border-slate-700/50 p-4 shadow-xl space-y-3 transition-colors">
            <div className="flex flex-col lg:flex-row gap-3">
              {/* Search */}
              <div className="relative flex-1">
                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400">
                  <Icon name="search" className="w-4 h-4" />
                </span>
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search by item name, ID, location, USN, or description..."
                  className="w-full pl-10 pr-4 py-2 rounded-xl border border-white/40 dark:border-slate-700/60 bg-white/55 dark:bg-slate-800/55 backdrop-blur-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-500 dark:placeholder:text-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
                />
              </div>

              {/* Type Filter Pills */}
              <div className="inline-flex p-1 rounded-xl bg-white/35 dark:bg-slate-800/45 backdrop-blur-sm border border-white/40 dark:border-slate-700/60 self-start">
                {["All", "Lost", "Found"].map((typeOpt) => (
                  <button
                    key={typeOpt}
                    type="button"
                    onClick={() => setTypeFilter(typeOpt)}
                    className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                      typeFilter === typeOpt
                        ? "bg-white/85 dark:bg-slate-900/85 text-indigo-700 dark:text-indigo-300 shadow-sm"
                        : "text-slate-700 dark:text-slate-200 hover:text-slate-950 dark:hover:text-white"
                    }`}
                  >
                    {typeOpt}
                  </button>

              {/* Category, Status, Sort */}
              <div className="flex flex-wrap sm:flex-nowrap gap-2">
                <select
                  aria-label="Filter by category"
                  value={categoryFilter}
                  onChange={(e) => setCategoryFilter(e.target.value)}
                  className="px-3 py-2 rounded-xl border border-white/40 dark:border-slate-700/60 text-xs sm:text-sm font-medium bg-white/55 dark:bg-slate-800/60 backdrop-blur-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                  onChange={(e) => setStatusFilter(e.target.value)}
                  className="px-3 py-2 rounded-xl border border-white/40 dark:border-slate-700/60 text-xs sm:text-sm font-medium bg-white/55 dark:bg-slate-800/60 backdrop-blur-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"

                    <option key={st} value={st}>{st}</option>

                <select
                  aria-label="Sort items"

                  onChange={(e) => setSortOrder(e.target.value)}

                <strong className="text-slate-900 dark:text-white">{items.length}</strong> campus reports
              </span>
              {hasActiveFilters && (

              <p className="text-sm text-slate-700 dark:text-slate-300 max-w-md mx-auto">
                Try clearing your search filters, or file a new Lost / Found report so the campus community can help.
              </p>
              <div className="flex justify-center gap-2 pt-1">
                {hasActiveFilters && (
                  <button
                    type="button"
                    onClick={clearFilters}
                    className="px-4 py-2 rounded-xl border border-white/40 dark:border-slate-700/60 bg-white/50 dark:bg-slate-800/50 text-sm font-semibold text-slate-800 dark:text-slate-100 hover:bg-white/75 dark:hover:bg-slate-800/80"
                  >
                    Clear Filters

                )}
                <button
                  type="button"
                  onClick={() => onOpenReport("Lost")}
                  className="px-4 py-2 rounded-xl bg-indigo-600/90 hover:bg-indigo-600 text-white text-sm font-semibold shadow-lg"
                >
                  + Report Item

              </div>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5">
              {filteredItems.map((item) => (
                <ItemCard
                  key={item.ID}
                  item={item}
                  onViewDetails={onViewDetails}
                  onOpenClaim={onOpenClaim}
                  onCopyID={onCopyID}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // Admin Analytics Charts (Responsive SVG)
    // =========================================================================
    function AnalyticsCharts({ stats }) {
      const total = stats.total || 0;
      const segments = [
        { label: "Active", value: stats.activeCount, color: "#0284c7" },
        { label: "Pending Claim", value: stats.pendingCount, color: "#d97706" },
        { label: "Resolved", value: stats.resolvedCount, color: "#059669" }
      ];

      const radius = 54;
      const circumference = 2 * Math.PI * radius;
      let cumulative = 0;

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
          {/* Status Donut Chart */}
          <div className="lg:col-span-5 bg-white/40 dark:bg-slate-900/40 backdrop-blur-lg rounded-2xl border border-white/30 dark:border-slate-700/50 p-5 shadow-xl flex flex-col justify-between transition-colors">
            <div>
              <h3 className="text-sm font-bold text-slate-900 dark:text-white">Workflow Status Distribution</h3>
              <p className="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Live breakdown across Active, Pending Claim &amp; Resolved</p>
            </div>

            <div className="my-4 flex flex-col sm:flex-row items-center gap-6">
              <div className="relative w-36 h-36 shrink-0">
                <svg viewBox="0 0 140 140" className="w-full h-full -rotate-90">
                  <circle
                    cx="70"
                    cy="70"
                    r={radius}
                    fill="transparent"
                    className="stroke-white/50 dark:stroke-slate-800/80"
                    strokeWidth="18"
                  />
                  {total > 0 &&
                    segments.map((seg) => {
                      if (seg.value === 0) return null;
                      const fraction = seg.value / total;
                      const dashLength = fraction * circumference;
                      const dashOffset = -cumulative * circumference;
                      cumulative += fraction;
                      return (
                        <circle
                          key={seg.label}
                          cx="70"
                          cy="70"
                          r={radius}
                          fill="transparent"
                          stroke={seg.color}
                          strokeWidth="18"
                          strokeDasharray={`${dashLength} ${circumference}`}
                          strokeDashoffset={dashOffset}
                          strokeLinecap="butt"
                        />
                      );
                    })}
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                  <span className="text-2xl font-extrabold text-slate-900 dark:text-white">{total}</span>
                  <span className="text-[11px] font-semibold text-slate-600 dark:text-slate-300 uppercase">Items</span>
                </div>
              </div>

              <div className="flex-1 w-full space-y-2.5">
                {segments.map((seg) => {
                  const pct = total > 0 ? Math.round((seg.value / total) * 100) : 0;
                  return (
                    <div key={seg.label} className="flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2">
                        <span
                          className="w-3 h-3 rounded-full shrink-0"
                          style={{ backgroundColor: seg.color }}
                        />
                        <span className="font-semibold text-slate-800 dark:text-slate-200">{seg.label}</span>
                      </div>
                      <span className="font-bold text-slate-900 dark:text-white">
                        {seg.value} <span className="text-slate-600 dark:text-slate-300 font-normal">({pct}%)</span>
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Category Breakdown Bar Chart */}
          <div className="lg:col-span-7 bg-white/40 dark:bg-slate-900/40 backdrop-blur-lg rounded-2xl border border-white/30 dark:border-slate-700/50 p-5 shadow-xl flex flex-col justify-between transition-colors">
            <div className="flex items-start justify-between gap-2">
              <div>
                <h3 className="text-sm font-bold text-slate-900 dark:text-white">Category &amp; Lost/Found Breakdown</h3>
                <p className="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Live counts grouped by item category</p>
              </div>
              <div className="flex items-center gap-3 text-xs font-medium">
                <span className="inline-flex items-center gap-1.5 text-slate-700 dark:text-slate-200">
                  <span className="w-2.5 h-2.5 rounded-sm bg-rose-500" /> Lost
                </span>
                <span className="inline-flex items-center gap-1.5 text-slate-700 dark:text-slate-200">
                  <span className="w-2.5 h-2.5 rounded-sm bg-emerald-500" /> Found
                </span>
              </div>
            </div>

            <div className="mt-4 space-y-3">
              {stats.byCategory.length === 0 ? (
                <p className="text-sm text-slate-500 dark:text-slate-400 py-8 text-center">No category data available.</p>
              ) : (
                stats.byCategory.map((row) => {
                  const maxCat = Math.max(...stats.byCategory.map((c) => c.total), 1);
                  const lostPct = (row.lost / maxCat) * 100;
                  const foundPct = (row.found / maxCat) * 100;
                  return (
                    <div key={row.category} className="space-y-1">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-1.5">
                          <CategoryGlyph category={row.category} />
                          {row.category}
                        </span>
                        <span className="text-slate-600 dark:text-slate-300 font-medium">
                          {row.total} total ({row.lost} Lost / {row.found} Found)
                        </span>
                      </div>
                      <div className="h-3 w-full bg-white/45 dark:bg-slate-800/70 rounded-full overflow-hidden flex border border-white/30 dark:border-slate-700/40">
                        {row.lost > 0 && (
                          <div
                            className="h-full bg-rose-500 transition-all duration-300"
                            style={{ width: `${lostPct}%` }}
                            title={`Lost: ${row.lost}`}
                          />
                        )}
                        {row.found > 0 && (
                          <div
                            className="h-full bg-emerald-500 transition-all duration-300"
                            style={{ width: `${foundPct}%` }}
                            title={`Found: ${row.found}`}
                          />
                        )}
                      </div>
                    </div>
                  );

                                  <Icon name="check" className="w-3.5 h-3.5" />
                                  Resolve Match
                                </button>
                              )}
                              <button
                                type="button"
                                onClick={() => onViewDetails(item)}

                                className="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-indigo-700 dark:hover:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 transition-colors"
                              >
                                View
                              </button>
                              <button
                                type="button"
                                onClick={() => onOpenEdit(item)}
                                title="Edit record"
                                className="p-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-indigo-700 dark:hover:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 transition-colors"
                              >
                                <Icon name="edit" className="w-4 h-4" />
                              </button>
                              <button
                                type="button"
                                onClick={() => onRequestDelete(item)}
                                title="Delete record"
                                className="p-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-rose-700 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/60 transition-colors"
                              >
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {/* Mobile/Tablet Card List */}
            <div className="lg:hidden divide-y divide-white/25 dark:divide-slate-700/40">
              {filteredItems.length === 0 ? (
                <div className="p-8 text-center text-sm text-slate-600 dark:text-slate-300">
                  No records match your current filters.
                </div>
              ) : (
                filteredItems.map((item) => {
                  const aiMatch = aiMatchMap[item.ID] || null;
                  return (
                    <div
                      key={item.ID}
                      className={`p-4 space-y-3 ${aiMatch ? "bg-indigo-500/5 dark:bg-indigo-950/25" : ""}`}
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-start gap-2.5 min-w-0">
                          {item.imageData && (
                            <img
                              src={item.imageData}
                              alt={item.itemName}
                              className="w-11 h-11 rounded-lg object-cover border border-slate-200 dark:border-slate-700 shrink-0"
                            />
